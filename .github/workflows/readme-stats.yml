# プロフィール README の GitHub Stats カードを日次で再生成し、SVG をこのリポジトリにコミットする
# Action の中身（action.yml / action.js）は v2 時点で確認済み: core パッケージを呼んで SVG を書くだけ
# https://github.com/stats-organization/github-readme-stats-action
name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=sugurutakahashi-1234&show_icons=true&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=sugurutakahashi-1234&layout=compact&langs_count=6&hide_border=true&title_color=2F81F7
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore(readme): stats カードを更新" || exit 0
          git push
